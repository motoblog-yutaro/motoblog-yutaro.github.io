<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆう太郎【motoblog】媒体資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3EFE6; --paper:#FAF7F1; --ink:#1B1C18; --muted:#6E6B60; --line:#DDD6C8;
  --olive:#3F4A2A; --olive2:#5C6B3C; --olive-soft:#E4E5D6; --brown:#8A5530; --brown-soft:#F0E3D5; --cream:#EFE6D2;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-en:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
.page{max-width:820px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px var(--line)}
/* hero */
.hero{color:#F6F1E6;background:#1E2018}
.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:center 60%}
.hero .in{padding:24px 26px 26px}
.mk{font-family:var(--f-en);font-style:italic;font-size:15px;letter-spacing:.12em;opacity:.85}
.hero h1 span{display:inline-block}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,5.6vw,38px);line-height:1.38;margin:8px 0 10px;letter-spacing:.02em}
.hero .who{font-size:14px;opacity:.92;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.hero .who b{font-family:var(--f-display);font-size:19px;letter-spacing:.04em}
.bio{margin:8px 0 0;font-size:13px;opacity:.85;line-height:1.7}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#F6F1E6;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px}
.cta i{font-style:normal;font-family:var(--f-en);font-size:18px;line-height:1}
/* strip */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--olive);color:#EEF0E3}
@media(min-width:640px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip div{padding:16px 18px;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);min-width:0}
.strip span{display:block;font-size:11px;letter-spacing:.12em;opacity:.75;font-weight:700}
.strip b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,28px);line-height:1.25}
.strip b small{font-size:12px;margin-left:2px;font-weight:600}
.strip .up b{color:#F3D9A6}
.strip em{display:block;font-style:normal;font-size:11px;opacity:.7;line-height:1.4}
.body{padding:8px 26px 34px}
section{padding-top:36px}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.sh .no{font-family:var(--f-en);font-style:italic;font-size:15px;color:var(--brown);letter-spacing:.06em;white-space:nowrap}
.sh h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;line-height:1.4}
.sh small{margin-left:auto;font-size:11px;color:var(--muted);text-align:right}
.sh{flex-wrap:wrap}
@media(max-width:639px){.sh small{margin-left:0;width:100%;text-align:left}.sh small br{display:none}.sh h2{font-size:19px}td.d{font-size:11px}th,td{padding:9px 4px}}
.lead{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.7;margin:0 0 14px}
.lead b{color:var(--brown)}
.lead b.y{color:var(--olive2)}
/* who */
.aud{display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
@media(min-width:640px){.aud{grid-template-columns:.9fr 1.4fr}}
.big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;color:var(--brown)}
.big small{font-size:18px}
.big.y{color:var(--olive2);font-size:44px}
.segs{display:flex;gap:26px;align-items:flex-end}
.sl{margin:6px 0 0;font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.bar em{font-style:normal;color:var(--muted);white-space:nowrap}
.bar .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:#C4BCAC;border-radius:5px}
.bar .t i.hi{background:var(--brown)}
.bar .t i.y{background:var(--olive2)}
.bar b{font-family:var(--f-mono);font-weight:500;text-align:right;font-size:12px}
/* why */
.why{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.why{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wc{background:var(--cream);padding:16px 16px 14px;border-radius:2px;min-width:0}
.wc .k{font-family:var(--f-en);font-style:italic;color:var(--brown);font-size:14px}
.wc h3{font-family:var(--f-display);font-size:17px;margin:2px 0 6px;line-height:1.4}
.wc p{margin:0;font-size:13px;color:#3d3e37;line-height:1.7}
/* voices */
.voices{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.voices{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vc{border-left:3px solid var(--brown);background:#fff9;padding:12px 14px;margin:0}
.vc p{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.65}
.vc cite{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:6px}
/* works */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
td.r,th.r{text-align:right;white-space:nowrap;font-family:var(--f-mono)}
td.d{white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
td .cat{display:inline-block;font-size:10px;font-weight:700;color:var(--olive);border:1px solid var(--olive2);padding:0 6px;border-radius:2px;margin-right:6px;vertical-align:1px}
td a{text-decoration:none;border-bottom:1px solid var(--line)}
/* menu */
.menu{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mi{border:1px solid var(--line);padding:14px 16px;border-radius:2px;background:#fff8;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
.mi .n{font-family:var(--f-en);font-style:italic;font-size:20px;color:var(--brown);line-height:1.2}
.mi b{display:block;font-size:15px}
.mi span{font-size:13px;color:var(--muted);line-height:1.6}
/* flow */
.flow{display:grid;grid-template-columns:1fr;gap:0;counter-reset:f}
@media(min-width:640px){.flow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fl{padding:12px 14px;border-top:2px solid var(--olive);min-width:0}
.fl .s{font-family:var(--f-en);font-style:italic;color:var(--olive2);font-size:13px}
.fl b{display:block;font-size:14px;line-height:1.5}
.fl span{font-size:12px;color:var(--muted);line-height:1.6;display:block;margin-top:2px}
.honest{margin-top:12px;border:1px dashed var(--brown);padding:12px 14px;border-radius:2px}
.honest b{font-size:13px;color:var(--brown)}
.honest p{margin:4px 0 0;font-size:13px;line-height:1.75}
.cases{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px}
@media(min-width:640px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
.case{background:var(--ink);color:#EFE9DC;padding:14px 16px;border-radius:2px;min-width:0}
.case .ck{font-family:var(--f-en);font-style:italic;font-size:13px;color:#CDBF9F}
.case .cb b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.2;color:#F3D9A6}
.case .cb b small{font-size:13px;margin-left:2px}
.case .cb em{font-style:normal;font-size:11px;opacity:.7;margin-left:6px}
.case .ct{display:block;font-weight:700;font-size:14px;margin-top:4px;text-decoration:none;color:#F6F1E6}
.case p{margin:4px 0 0;font-size:12px;opacity:.85;line-height:1.7}
.tl{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 4px}
.promise{margin-top:14px;background:var(--olive-soft);padding:12px 14px;font-size:13px;border-radius:2px}
.photos{display:flex;gap:6px;align-items:flex-start}
.photos .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.photos img{width:100%;height:auto;display:block}
/* contact */
.contact{background:var(--ink);color:#F1ECE0;padding:26px 26px 30px}
.contact .mk{color:#CDBF9F}
.contact h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:4px 0 6px}
.contact p{margin:0 0 14px;font-size:13px;opacity:.8}
.crow{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.crow span{font-size:11px;letter-spacing:.12em;opacity:.65;min-width:80px}
.crow a,.crow b{font-weight:700;word-break:break-all;color:#F6F1E6}
.crow em{font-style:normal;font-size:12px;opacity:.7}
.copy{border:1px solid rgba(255,255,255,.5);background:transparent;color:#F6F1E6;font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;cursor:pointer}
.foot{font-size:11px;color:var(--muted);text-align:center;padding:14px 18px 30px}

/* ── 立体感とガラス（2026-11-13 追加。色と書体は元のまま） ── */
body{padding:0}
.page{position:relative;box-shadow:0 0 0 1px var(--line),0 2px 4px rgba(60,45,25,.06),0 18px 40px -14px rgba(60,45,25,.2),0 60px 110px -50px rgba(60,45,25,.28)}
@media(min-width:860px){body{padding-top:28px}.page{border-radius:18px;overflow:clip}}
/* 上に残るすりガラスの帯 */
.gbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 20px;background:linear-gradient(rgba(250,247,241,.74),rgba(250,247,241,.5));-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(27,28,24,.08),0 10px 24px -16px rgba(30,25,15,.45)}
.gbar b{font-family:var(--f-display);font-size:14px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gbar a{flex:none;font-size:12px;font-weight:700;text-decoration:none;padding:5px 15px;border-radius:999px;color:#F6F1E6;background:linear-gradient(#52603A,var(--olive));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 1px rgba(0,0,0,.2),0 6px 12px -6px rgba(63,74,42,.8);transition:transform .25s ease-out}
.gbar a:hover{transform:translateY(-1px)}
.hero{margin-top:-48px;background:linear-gradient(180deg,#25271E,#1A1C15)}
.hp{position:relative}
.chip{position:absolute;left:18px;bottom:16px;font-family:var(--f-en);font-style:italic;font-size:14px;letter-spacing:.12em;color:#F6F1E6;padding:5px 16px 6px;border-radius:999px;background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.18),0 10px 22px -10px rgba(0,0,0,.6);text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media(max-width:639px){.hero{margin-top:0}.chip{left:14px;top:12px;bottom:auto;font-size:12px;padding:3px 13px 4px}}
.hero .in{box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.cta{background:linear-gradient(#FFFDF8,#EAE2D0);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(138,85,48,.18),0 1px 1px rgba(0,0,0,.35),0 12px 24px -10px rgba(0,0,0,.7);transition:transform .28s ease-out,box-shadow .28s ease-out}
.cta:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(138,85,48,.18),0 1px 1px rgba(0,0,0,.35),0 18px 30px -12px rgba(0,0,0,.8)}
.cta:active{transform:translateY(1px)}
/* 数字の帯：磨いた板 */
.strip{position:relative;z-index:1;background:linear-gradient(180deg,#4D5A34 0%,var(--olive) 52%,#353F1F 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(0,0,0,.3),0 16px 26px -20px rgba(40,48,20,.9)}
.strip::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 34%)}
.strip b{text-shadow:0 1px 0 rgba(0,0,0,.28)}
/* ガラスの板 */
.wc,.mi,.vc,.honest,.promise,.case{position:relative;border-radius:14px;transition:transform .3s ease-out,box-shadow .3s ease-out}
.wc,.mi,.vc,.promise{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(138,85,48,.1),0 0 0 1px rgba(255,255,255,.55),0 1px 2px rgba(60,45,25,.1),0 8px 16px -8px rgba(60,45,25,.18),0 26px 40px -26px rgba(60,45,25,.3)}
.wc{background:linear-gradient(158deg,#F8F2E2 0%,var(--cream) 46%,#E6DCC3 100%);padding:18px 18px 16px}
.mi{border:0;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.5))}
.vc{border-radius:4px 14px 14px 4px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));padding:14px 16px}
.promise{background:linear-gradient(180deg,#EEEFE2,#DDDFCC);padding:14px 16px}
.honest{background:rgba(255,255,255,.45);box-shadow:inset 0 2px 5px rgba(60,45,25,.1),0 1px 0 rgba(255,255,255,.9);padding:14px 16px}
.wc:hover,.mi:hover,.case:hover{transform:translateY(-3px)}
.wc:hover,.mi:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(138,85,48,.1),0 0 0 1px rgba(255,255,255,.55),0 1px 2px rgba(60,45,25,.1),0 14px 22px -10px rgba(60,45,25,.22),0 36px 50px -28px rgba(60,45,25,.36)}
.case{overflow:hidden;background:linear-gradient(155deg,#34362B 0%,#1F201B 46%,#141511 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.3),0 12px 20px -10px rgba(27,28,24,.5),0 30px 44px -28px rgba(27,28,24,.7);padding:16px 18px}
.case::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(122deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,0) 36%)}
.case .cb b{text-shadow:0 1px 0 rgba(0,0,0,.4),0 0 18px rgba(243,217,166,.18)}
/* くぼみと盛り上がり */
.bar .t{box-shadow:inset 0 1px 2px rgba(60,45,25,.28),0 1px 0 rgba(255,255,255,.85)}
.bar .t i{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.12)}
.big{text-shadow:0 1px 0 rgba(255,255,255,.9),0 12px 20px rgba(138,85,48,.18)}
.big.y{text-shadow:0 1px 0 rgba(255,255,255,.9),0 12px 20px rgba(92,107,60,.18)}
td .cat{border-radius:999px;padding:0 8px;background:linear-gradient(#fff,rgba(255,255,255,.4));box-shadow:0 1px 1px rgba(60,45,25,.1)}
.photos{gap:8px}.photos .col{gap:8px}
.photos img{border-radius:8px;box-shadow:0 1px 2px rgba(60,45,25,.2),0 14px 22px -16px rgba(60,45,25,.5)}
/* 連絡先 */
.contact{background:linear-gradient(180deg,#24251F,#151612);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.cbox{border-radius:16px;padding:2px 18px;background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.07),0 24px 40px -24px #000}
.cbox .crow:first-child{border-top:0}
.crow{padding:11px 0}
.copy{border:0;padding:3px 13px;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.14),0 6px 12px -6px #000}
.terms{position:relative;margin-top:12px;border-radius:14px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(138,85,48,.1),0 0 0 1px rgba(255,255,255,.55),0 1px 2px rgba(60,45,25,.1),0 8px 16px -8px rgba(60,45,25,.18),0 26px 40px -26px rgba(60,45,25,.3)}
.terms b{font-size:13px;color:var(--olive)}
.terms ul{margin:6px 0 0;padding-left:1.2em;font-size:13px;line-height:1.85}
.terms li+li{margin-top:2px}
.copy{line-height:1.5;align-self:center}
.copy:active{transform:translateY(1px)}
@media(max-width:639px){.crow{gap:1px 10px}.crow span{min-width:100%}.crow b{font-size:14px}.crow .copy{margin-left:auto}}
a:focus-visible,button:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.wc,.mi,.vc,.case,.cta,.gbar a{transition:none}.wc:hover,.mi:hover,.case:hover,.cta:hover{transform:none}}
</style>
</head>
<body>
<div class="page" id="kit"></div>
